name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: Backend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Floating-point audit
        run: |
          echo "Checking for bare JS arithmetic on financial paths..."
          VIOLATIONS=$(grep -rn "reduce((s" \
            src/services/statementGenerator.ts \
            src/services/journal_entry_service.ts \
            src/services/financialStatements.ts \
            src/services/cashFlow.ts \
            src/services/equityChanges.ts \
            src/services/adjusted_trial_balance_service.ts \
            2>/dev/null | grep -v "Decimal\|sumRound2\|from(" | grep -v "node_modules" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "FLOATING-POINT VIOLATIONS FOUND:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "No floating-point violations found."

      - name: SoD bypass audit
        run: |
          echo "Checking for hardcoded ALLOW_SAME_USER_APPROVE bypass..."
          VIOLATIONS=$(grep -rn 'ALLOW_SAME_USER_APPROVE' src/ --include="*.ts" \
            | grep -v 'process\.env' \
            | grep -v '\.test\.' \
            | grep -v '/tests/' \
            | grep -v '// ' \
            | grep -v '\*' \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: ALLOW_SAME_USER_APPROVE referenced without process.env (possible hardcode):"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "No SoD bypass hardcodes found."

  canonical-close-test:
    name: Canonical Canadian ASPE close tests
    runs-on: ubuntu-latest
    needs: [typecheck-and-build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sovereign
          POSTGRES_PASSWORD: sovereign_test
          POSTGRES_DB: sovereign_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sovereign -d sovereign_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run canonical close and adapter test suite
        env:
          JWT_SECRET: test-secret-do-not-use-in-prod
          NODE_ENV: test
          MODE: dev
        run: npm test -- --runInBand

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://sovereign:sovereign_test@localhost:5432/sovereign_test
        run: npm run db:migrate

      - name: Seed integration data
        env:
          DATABASE_URL: postgresql://sovereign:sovereign_test@localhost:5432/sovereign_test
          JWT_SECRET: test-secret-do-not-use-in-prod
          NODE_ENV: test
          MODE: dev
        run: npm run seed:demo

      - name: Run database-backed integration checks (supplemental)
        timeout-minutes: 5
        env:
          DATABASE_URL: postgresql://sovereign:sovereign_test@localhost:5432/sovereign_test
          JWT_SECRET: test-secret-do-not-use-in-prod
          NODE_ENV: development
          MODE: demo
        run: |
          node dist/server.js > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/health > /dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl --fail --silent http://localhost:3000/health > /dev/null; then
            cat server.log
            exit 1
          fi

          if ! npm run test:integration; then
            cat server.log
            exit 1
          fi

  docker:
    name: Backend container build
    runs-on: ubuntu-latest
    needs: [typecheck-and-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sovereign-cpa-engine:ci .

  frontend-build:
    name: Frontend install and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
