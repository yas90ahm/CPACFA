steps:
  # Step 1: Build backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sabit-backend:$_TAG'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sabit-backend:latest'
      - '.'
    id: 'build-backend'

  # Step 2: Build frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sabit-frontend:$_TAG'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sabit-frontend:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://sabit-backend-577604067574.us-central1.run.app'
      - '-f'
      - 'frontend/Dockerfile'
      - 'frontend/'
    id: 'build-frontend'

  # Step 3: Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sabit-backend:$_TAG']
    id: 'push-backend'
    waitFor: ['build-backend']

  # Step 4: Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sabit-frontend:$_TAG']
    id: 'push-frontend'
    waitFor: ['build-frontend']

  # Step 5: Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'sabit-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sabit-backend:$_TAG'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--port'
      - '3000'
      - '--set-env-vars'
      - 'NODE_ENV=staging'
    id: 'deploy-backend'
    waitFor: ['push-backend']

  # Step 6: Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'sabit-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sabit-frontend:$_TAG'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--port'
      - '3000'
    id: 'deploy-frontend'
    waitFor: ['push-frontend']

images:
  - 'gcr.io/$PROJECT_ID/sabit-backend:$_TAG'
  - 'gcr.io/$PROJECT_ID/sabit-backend:latest'
  - 'gcr.io/$PROJECT_ID/sabit-frontend:$_TAG'
  - 'gcr.io/$PROJECT_ID/sabit-frontend:latest'

substitutions:
  _TAG: 'latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
