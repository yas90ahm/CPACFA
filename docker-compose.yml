services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sovereign:sovereign_dev@db:5432/sovereign_engine
      SLM_SERVICE_URL: http://slm:8000
    depends_on:
      db:
        condition: service_healthy
      slm:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - evidence_data:/app/data/evidence
      - storage_data:/app/storage

  slm:
    build:
      context: ./slm
      dockerfile: Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: sovereign
      POSTGRES_PASSWORD: sovereign_dev
      POSTGRES_DB: sovereign_engine
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovereign -d sovereign_engine"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
  evidence_data:
  storage_data:
